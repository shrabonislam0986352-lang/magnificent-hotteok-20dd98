<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error Value — Sign In & Sign Up</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(20, 27, 45, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --cyan: #38bdf8;
      --danger: #f87171;
      --success: #34d399;
      --input-bg: rgba(15, 23, 42, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.22), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.16), transparent 45%),
        var(--bg);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand span {
      color: var(--cyan);
    }

    .user-pill {
      display: none;
      align-items: center;
      gap: 0.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.84rem;
    }

    .logout-btn {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--input-bg);
      padding: 0.3rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 0.55rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1.4rem;
      line-height: 1.45;
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .form.active {
      display: flex;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.82rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 0.65rem;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      margin-top: 0.25rem;
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 0.65rem;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .otp-box {
      display: none;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 0.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .otp-box.active {
      display: flex;
    }

    .message {
      margin-top: 0.9rem;
      font-size: 0.84rem;
      text-align: center;
      color: var(--cyan);
      min-height: 1.2rem;
      line-height: 1.45;
    }

    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }

    #inside-site {
      display: none;
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Error <span>Value</span></div>
    <div class="user-pill" id="user-pill">
      <span id="user-label"></span>
      <button class="logout-btn" id="logout-btn" type="button">Sign Out</button>
    </div>
  </header>

  <main>
    <section class="card" id="auth-card">
      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-target="signin" type="button">Sign In</button>
        <button class="tab-btn" data-target="signup" type="button">Sign Up</button>
      </div>

      <h1 id="form-title">Sign In</h1>
      <p class="subtitle" id="form-subtitle">Enter your Gmail and 8-digit password to enter.</p>

      <!-- Sign In Form -->
      <form id="signin" class="form active" novalidate>
        <div class="field">
          <label for="signin-email">Gmail</label>
          <input id="signin-email" type="email" placeholder="you@gmail.com" required />
        </div>
        <div class="field">
          <label for="signin-password">Password (8 digits)</label>
          <input
            id="signin-password"
            type="password"
            inputmode="numeric"
            maxlength="8"
            placeholder="8-digit password"
            required
          />
        </div>
        <button class="submit-btn" type="submit">Sign In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup" class="form" novalidate>
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input id="signup-name" type="text" placeholder="Your Full Name" required />
        </div>
        <div class="field">
          <label for="signup-email">Gmail</label>
          <input id="signup-email" type="email" placeholder="you@gmail.com" required />
        </div>
        <div class="field">
          <label for="signup-password">Password (8 numbers only)</label>
          <input
            id="signup-password"
            type="password"
            inputmode="numeric"
            maxlength="8"
            placeholder="Example: 12345678"
            required
          />
        </div>
        <button class="submit-btn" id="send-code-btn" type="submit">Send Code to Gmail</button>
      </form>

      <!-- Email Verification Code Box -->
      <div class="otp-box" id="otp-box">
        <div class="field">
          <label for="otp-input">Verification Code (sent to your Gmail)</label>
          <input
            id="otp-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit code"
          />
        </div>
        <button class="submit-btn" id="verify-code-btn" type="button">Verify & Complete Sign Up</button>
      </div>

      <p class="message" id="status-msg"></p>
    </section>

    <!-- Website Content After Login -->
    <section id="inside-site">
      <h1>Welcome to Error Value</h1>
      <p class="subtitle" id="welcome-info" style="margin-top: 0.4rem;">
        You are now logged in to the website.
      </p>
    </section>
  </main>

  <!-- EmailJS Browser SDK (Optional: for real email delivery) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // =========================================================================
    // EmailJS সেটিংস (আসল Gmail-এ কোড পাঠাতে চাইলে এখানে নিজের কী বসাও)
    // =========================================================================
    const EMAILJS_CONFIG = {
      publicKey: "YOUR_EMAILJS_PUBLIC_KEY",
      serviceId: "YOUR_EMAILJS_SERVICE_ID",
      templateId: "YOUR_EMAILJS_TEMPLATE_ID"
    };

    const hasEmailJsKeys =
      !EMAILJS_CONFIG.publicKey.startsWith("YOUR_") &&
      !EMAILJS_CONFIG.serviceId.startsWith("YOUR_") &&
      !EMAILJS_CONFIG.templateId.startsWith("YOUR_");

    if (hasEmailJsKeys && window.emailjs) {
      window.emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
    }

    const USERS_KEY = "error_value_users_v1";
    const SESSION_KEY = "error_value_session_v1";

    let pendingSignup = null;

    const tabs = document.querySelectorAll(".tab-btn");
    const forms = document.querySelectorAll(".form");
    const titleEl = document.getElementById("form-title");
    const subtitleEl = document.getElementById("form-subtitle");
    const statusMsg = document.getElementById("status-msg");
    const otpBox = document.getElementById("otp-box");
    const authCard = document.getElementById("auth-card");
    const insideSite = document.getElementById("inside-site");
    const userPill = document.getElementById("user-pill");
    const userLabel = document.getElementById("user-label");
    const welcomeInfo = document.getElementById("welcome-info");

    function setMessage(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `message ${type}`.trim();
    }

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function isValidGmail(email) {
      return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email.trim());
    }

    function isEightNumberPassword(pass) {
      return /^\d{8}$/.test(pass);
    }

    function generateSixDigitCode() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    function showInsideSite(user) {
      authCard.style.display = "none";
      insideSite.style.display = "block";
      userPill.style.display = "flex";
      userLabel.textContent = `${user.fullName} (${user.email})`;
      welcomeInfo.textContent = `Logged in as ${user.fullName} — ${user.email}`;
    }

    function showAuthCard() {
      authCard.style.display = "block";
      insideSite.style.display = "none";
      userPill.style.display = "none";
    }

    // Tab switching
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const target = tab.dataset.target;
        tabs.forEach((t) => t.classList.toggle("active", t === tab));
        forms.forEach((f) => f.classList.toggle("active", f.id === target));
        otpBox.classList.remove("active");
        pendingSignup = null;
        if (target === "signin") {
          titleEl.textContent = "Sign In";
          subtitleEl.textContent = "Enter your Gmail and 8-digit password to enter.";
        } else {
          titleEl.textContent = "Sign Up";
          subtitleEl.textContent = "Full name, Gmail, and an 8-number password to get a code.";
        }
        setMessage("");
      });
    });

    // Sign Up -> Send 6-digit code to Gmail
    document.getElementById("signup").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fullName = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim().toLowerCase();
      const password = document.getElementById("signup-password").value.trim();

      if (!fullName) {
        setMessage("Full Name লিখো।", "error");
        return;
      }
      if (!isValidGmail(email)) {
        setMessage("সঠিক @gmail.com ঠিকানা দাও।", "error");
        return;
      }
      if (!isEightNumberPassword(password)) {
        setMessage("Password অবশ্যই ঠিক ৮ সংখ্যার (0-9) হতে হবে।", "error");
        return;
      }

      const users = getUsers();
      if (users.some((u) => u.email === email)) {
        setMessage("এই Gmail দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে। Sign In ট্যাবে যাও।", "error");
        return;
      }

      const code = generateSixDigitCode();
      pendingSignup = { fullName, email, password, code };

      if (hasEmailJsKeys && window.emailjs) {
        setMessage("Gmail-এ ভেরিফিকেশন কোড পাঠানো হচ্ছে...");
        try {
          await window.emailjs.send(
            EMAILJS_CONFIG.serviceId,
            EMAILJS_CONFIG.templateId,
            {
              to_email: email,
              to_name: fullName,
              verification_code: code
            }
          );
          otpBox.classList.add("active");
          setMessage(`${email}-এ ৬ সংখ্যার কোড পাঠানো হয়েছে। নিচে কোড বসিয়ে ভেরিফাই করো।`, "success");
        } catch {
          otpBox.classList.add("active");
          setMessage(`EmailJS পাঠানো যায়নি। টেস্ট কোড: ${code}`, "error");
        }
      } else {
        otpBox.classList.add("active");
        setMessage(`(Demo Mode) ${email} এর জন্য কোড: ${code} — নিচে বসিয়ে Verify করো।`, "success");
      }
    });

    // Verify OTP Code & Save Account
    document.getElementById("verify-code-btn").addEventListener("click", () => {
      const enteredCode = document.getElementById("otp-input").value.trim();
      if (!pendingSignup) {
        setMessage("আগে Sign Up ফর্ম থেকে কোড পাঠাও।", "error");
        return;
      }
      if (enteredCode !== pendingSignup.code) {
        setMessage("ভেরিফিকেশন কোড সঠিক নয়।", "error");
        return;
      }

      const users = getUsers();
      const newUser = {
        fullName: pendingSignup.fullName,
        email: pendingSignup.email,
        password: pendingSignup.password
      };
      users.push(newUser);
      saveUsers(users);

      pendingSignup = null;
      otpBox.classList.remove("active");
      document.getElementById("otp-input").value = "";
      document.getElementById("signup").reset();

      // Switch to Sign In tab so user can sign in with Gmail + 8-number password
      document.querySelector('.tab-btn[data-target="signin"]').click();
      document.getElementById("signin-email").value = newUser.email;
      setMessage("অ্যাকাউন্ট তৈরি হয়েছে! এখন Gmail আর ৮ সংখ্যার Password দিয়ে Sign In করো।", "success");
    });

    // Sign In -> Gmail + 8-number Password
    document.getElementById("signin").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("signin-email").value.trim().toLowerCase();
      const password = document.getElementById("signin-password").value.trim();

      if (!isValidGmail(email)) {
        setMessage("সঠিক @gmail.com ঠিকানা দাও।", "error");
        return;
      }
      if (!isEightNumberPassword(password)) {
        setMessage("Password অবশ্যই ৮ সংখ্যার হতে হবে।", "error");
        return;
      }

      const users = getUsers();
      const matched = users.find((u) => u.email === email && u.password === password);

      if (!matched) {
        setMessage("Gmail বা ৮ সংখ্যার Password মিলছে না।", "error");
        return;
      }

      localStorage.setItem(SESSION_KEY, JSON.stringify(matched));
      setMessage("লগইন সফল হয়েছে!", "success");
      showInsideSite(matched);
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem(SESSION_KEY);
      showAuthCard();
      setMessage("Signed out.", "success");
    });

    // Restore session if already signed in
    const savedSession = localStorage.getItem(SESSION_KEY);
    if (savedSession) {
      try {
        showInsideSite(JSON.parse(savedSession));
      } catch {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  </script>
</body>
</html>
